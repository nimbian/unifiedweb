# Alembic configuration for the Satchemon API.
#
# IMPORTANT: this project migrates an EXISTING, populated database. The baseline
# revision is an empty no-op so you can `alembic stamp head` against production
# without altering a single table. The env.py is configured to ignore tables that
# are not part of our mapped models (the Discord-bot-owned tables), so autogenerate
# will never propose dropping them.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is injected from app settings in env.py — keep this blank.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
