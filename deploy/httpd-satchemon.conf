# Apache httpd vhost for Satchemon on CentOS (the httpd equivalent of nginx.conf).
# Install to /etc/httpd/conf.d/satchemon.conf, then:
#   sudo setsebool -P httpd_can_network_connect 1     # allow proxying to the backend port
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# Serves the built React SPA as static files and reverse-proxies /api to the
# FastAPI/Gunicorn process on 127.0.0.1:8080 — a single origin, so cookies (JWT
# refresh) flow without CORS.
#
# Requires these modules (all ship with httpd; check with `httpd -M`): proxy,
# proxy_http, headers, expires, dir. On RHEL/CentOS they are loaded from
# /etc/httpd/conf.modules.d/ by default.

<VirtualHost *:80>
    ServerName satchemon.local            # adjust to your hostname / add TLS in production

    DocumentRoot /opt/satchemon/frontend/dist

    # Cap request bodies (nginx client_max_body_size 25m). At vhost scope this
    # also covers proxied /api requests.
    LimitRequestBody 26214400

    # ── API -> FastAPI backend ────────────────────────────────────────────────
    # Keep the /api prefix and pass the real Host + forwarded headers through.
    # Listed before the SPA so it wins; ProxyPass runs before the filesystem.
    ProxyPreserveHost On
    ProxyPass        /api/ http://127.0.0.1:8080/api/ timeout=120
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    RequestHeader set X-Forwarded-Proto "http"        # use "https" on the TLS vhost

    # ── React SPA (static) ────────────────────────────────────────────────────
    <Directory /opt/satchemon/frontend/dist>
        Require all granted
        # SPA fallback: any non-file path returns index.html so React Router
        # works on deep links / refresh. /api/* is proxied above and never
        # reaches this.
        FallbackResource /index.html
    </Directory>

    # Long-cache hashed Vite assets; a missing hashed file should 404, not fall
    # back to index.html.
    <Directory /opt/satchemon/frontend/dist/assets>
        FallbackResource disabled
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "public, immutable"
    </Directory>

    ErrorLog  /var/log/httpd/satchemon_error.log
    CustomLog /var/log/httpd/satchemon_access.log combined
</VirtualHost>


# ── Production TLS: terminate HTTPS here, redirect 80 -> 443 ───────────────────
# Replace the *:80 vhost above with a redirect, and serve everything on 443.
# Remember to set COOKIE_SECURE=true in backend/.env when serving over HTTPS.
#
# <VirtualHost *:80>
#     ServerName satchemon.example.com
#     Redirect permanent / https://satchemon.example.com/
# </VirtualHost>
#
# <VirtualHost *:443>
#     ServerName satchemon.example.com
#     DocumentRoot /opt/satchemon/frontend/dist
#
#     SSLEngine on
#     SSLCertificateFile    /etc/pki/tls/certs/satchemon.crt
#     SSLCertificateKeyFile /etc/pki/tls/private/satchemon.key
#
#     LimitRequestBody 26214400
#     ProxyPreserveHost On
#     ProxyPass        /api/ http://127.0.0.1:8080/api/ timeout=120
#     ProxyPassReverse /api/ http://127.0.0.1:8080/api/
