# Apache httpd vhost for the MooreDnD unified portal.
# Install to /etc/httpd/conf.d/moorednd.conf, then:
#   sudo setsebool -P httpd_can_network_connect 1     # allow proxying to backend ports
#   sudo apachectl configtest && sudo systemctl reload httpd
#
# Single origin (PLAN §4) so one JWT + one refresh cookie work everywhere:
#
#     /            -> unified SPA (static files, built by Vite)
#     /api/arena/  -> dndbattle arena server   (portal JWT accepted in Phase 2)
#     /api/        -> portal backend (fork of newweb/backend)
#
# The /api/arena/ rule is listed BEFORE /api/ so the longer, more specific arena
# prefix wins; Apache evaluates ProxyPass rules top-to-bottom.
#
# Requires these modules (all ship with httpd; check with `httpd -M`): proxy,
# proxy_http, headers, expires, dir.

<VirtualHost *:80>
    ServerName moorednd.local             # adjust to your hostname / add TLS in production

    DocumentRoot /opt/moorednd/frontend/dist

    # Cap request bodies (matches the nginx client_max_body_size 25m). At vhost
    # scope this also covers proxied /api requests.
    LimitRequestBody 26214400

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"        # use "https" on the TLS vhost

    # ── /api/arena -> dndbattle arena server ──────────────────────────────────
    # Phase 0 wires the route; the arena FORK that accepts the portal JWT lands
    # in Phase 2. The arena process listens on ARENA_UPSTREAM below — set it to
    # wherever the dndbattle server actually binds. The /api/arena prefix is
    # preserved end-to-end (the arena fork mounts its portal routes under it).
    ProxyPass        /api/arena/ http://127.0.0.1:8090/api/arena/ timeout=120
    ProxyPassReverse /api/arena/ http://127.0.0.1:8090/api/arena/

    # ── /api -> portal backend (FastAPI/Gunicorn on 127.0.0.1:8080) ───────────
    ProxyPass        /api/ http://127.0.0.1:8080/api/ timeout=120
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/

    # ── Unified React SPA (static) ────────────────────────────────────────────
    <Directory /opt/moorednd/frontend/dist>
        Require all granted
        # SPA fallback: any non-file path returns index.html so React Router works
        # on deep links / refresh. /api/* is proxied above and never reaches this.
        FallbackResource /index.html
    </Directory>

    # Long-cache hashed Vite assets; a missing hashed file should 404, not fall
    # back to index.html.
    <Directory /opt/moorednd/frontend/dist/assets>
        FallbackResource disabled
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
        Header set Cache-Control "public, immutable"
    </Directory>

    ErrorLog  /var/log/httpd/moorednd_error.log
    CustomLog /var/log/httpd/moorednd_access.log combined
</VirtualHost>


# ── Production TLS: terminate HTTPS here, redirect 80 -> 443 ───────────────────
# Replace the *:80 vhost above with a redirect, serve everything on 443, and set
# COOKIE_SECURE=true in backend/.env.
#
# <VirtualHost *:80>
#     ServerName moorednd.example.com
#     Redirect permanent / https://moorednd.example.com/
# </VirtualHost>
#
# <VirtualHost *:443>
#     ServerName moorednd.example.com
#     DocumentRoot /opt/moorednd/frontend/dist
#
#     SSLEngine on
#     SSLCertificateFile    /etc/pki/tls/certs/moorednd.crt
#     SSLCertificateKeyFile /etc/pki/tls/private/moorednd.key
