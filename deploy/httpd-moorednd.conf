# ── Phase 5: retire the standalone dndbattle web ──────────────────────────────
# The old dndbattle site was a SEPARATE origin (its root paths /shop, /leaderboard,
# /roster… collide with newweb's, so they never shared a host). Point the old
# dndbattle hostname at this vhost to 301 every old path to its new /dndbattle/*
# home. Fill in the real old hostname (PLAN §11 #5) + TLS, then enable. Note the
# plural->singular character-sheet path and that both "/" and "/arena" map to
# /dndbattle.
#
# <VirtualHost *:80>
#     ServerName dndbattle.example.com          # the OLD dndbattle hostname
#     RedirectMatch 301 ^/characters/(.*)$ http://moorednd.example.com/dndbattle/character/$1
#     RedirectMatch 301 ^/roster$          http://moorednd.example.com/dndbattle/roster
#     RedirectMatch 301 ^/shop$            http://moorednd.example.com/dndbattle/shop
#     RedirectMatch 301 ^/leaderboard$     http://moorednd.example.com/dndbattle/leaderboard
#     RedirectMatch 301 ^/hof$             http://moorednd.example.com/dndbattle/hof
#     RedirectMatch 301 ^/arena$           http://moorednd.example.com/dndbattle
#     RedirectMatch 301 ^/(.*)$            http://moorednd.example.com/dndbattle
# </VirtualHost>
