# nginx server block for Satchemon on CentOS.
# Install to /etc/nginx/conf.d/satchemon.conf, then: sudo nginx -t && sudo systemctl reload nginx
#
# Serves the built React SPA as static files and reverse-proxies /api to the
# FastAPI/Gunicorn process on 127.0.0.1:8080.

server {
    listen 80;
    server_name satchemon.local;   # adjust to your hostname / add TLS in production

    root /opt/satchemon/frontend/dist;
    index index.html;

    # Long-cache hashed Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API -> FastAPI backend. Pass cookies/headers through for JWT refresh.
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamed Drive images can be large; relax buffering.
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    # SPA fallback: every non-file path returns index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
