# nginx server block for the MooreDnD unified portal on CentOS.
# Install to /etc/nginx/conf.d/moorednd.conf, then: sudo nginx -t && sudo systemctl reload nginx
#
# Single origin (PLAN §4) so one JWT + one refresh cookie work everywhere:
#     /            -> unified SPA (static files, built by Vite)
#     /api/arena/  -> dndbattle arena server   (portal JWT accepted in Phase 2)
#     /api/        -> portal backend (fork of newweb/backend)
#
# nginx uses longest-prefix matching, so the /api/arena/ location wins over /api/
# regardless of order.

# Upstreams. Set the arena upstream to wherever the dndbattle server actually
# binds; 8090 is a placeholder wired in Phase 0 (the arena fork lands in Phase 2).
upstream moorednd_portal { server 127.0.0.1:8080; }
upstream moorednd_arena  { server 127.0.0.1:8090; }

server {
    listen 80;
    server_name www.moorednd.com moorednd.local;    # prod host (+ local alias); add TLS in production

    root /opt/moorednd/frontend/dist;
    index index.html;

    # Long-cache hashed Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── /api/arena -> arena server (fork of dndbattle) ────────────────────────
    # The arena keeps its native /api/* routes; the trailing "/api/" on proxy_pass
    # STRIPS the /arena segment, so /api/arena/characters -> arena /api/characters.
    # The arena accepts the portal JWT as `Authorization: Bearer` (PLAN §8).
    location /api/arena/ {
        proxy_pass http://moorednd_arena/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Arena uses a websocket for live arena state.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # ── /api -> portal backend. Pass cookies/headers through for JWT refresh. ──
    location /api/ {
        proxy_pass http://moorednd_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamed Drive images can be large; relax buffering.
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    # ── Phase 5 (PLAN §10): 301s from the retired standalone newweb URLs ───────
    # newweb served the Satchemon pages at THIS origin's root; the unified SPA
    # moved them under /satchemon/*. Permanent-redirect the old paths so existing
    # bookmarks, Discord message links, and search-engine results keep working
    # after the old frontend is decommissioned. $is_args$args preserves any query
    # (e.g. /search?name=…). These sit above `location /` so they win over the SPA
    # fallback; each pattern is anchored so none can shadow /satchemon, /dndbattle,
    # /api, /assets, /account, /login, or the "/" homepage.
    location = /me          { return 301 /satchemon/me$is_args$args; }
    location = /search      { return 301 /satchemon/search$is_args$args; }
    location = /leaderboard { return 301 /satchemon/leaderboard$is_args$args; }
    location = /shop        { return 301 /satchemon/shop$is_args$args; }
    location = /slideshow   { return 301 /satchemon/slideshow$is_args$args; }
    location = /dnd         { return 301 /satchemon/progress$is_args$args; }
    location ~ ^/user/(.*)$ { return 301 /satchemon/user/$1$is_args$args; }
    location ~ ^/dnd/(.*)$  { return 301 /satchemon/progress/$1$is_args$args; }

    # SPA fallback: every non-file path returns index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── Phase 5: retire the standalone dndbattle web ──────────────────────────────
# The old dndbattle site was a SEPARATE origin (its root paths /shop, /leaderboard,
# /roster… collide with newweb's, so the two could never have shared a host). Once
# the unified SPA serves the arena under www.moorednd.com/dndbattle/*, point the old
# dndbattle hostname here to 301 every old path to its new home. Fill in the real
# old hostname (PLAN §11 #5) and TLS, then enable. Note the plural→singular change
# for character sheets (old /characters/:id -> new /dndbattle/character/:id) and
# that the old arena index "/" and "/arena" both map to /dndbattle.
#
# server {
#     listen 80;
#     server_name dndbattle.example.com;          # the OLD dndbattle hostname
#     location = /              { return 301 https://www.moorednd.com/dndbattle; }
#     location = /arena         { return 301 https://www.moorednd.com/dndbattle; }
#     location = /roster        { return 301 https://www.moorednd.com/dndbattle/roster; }
#     location = /shop          { return 301 https://www.moorednd.com/dndbattle/shop; }
#     location = /leaderboard   { return 301 https://www.moorednd.com/dndbattle/leaderboard; }
#     location = /hof           { return 301 https://www.moorednd.com/dndbattle/hof; }
#     location ~ ^/characters/(.*)$ { return 301 https://www.moorednd.com/dndbattle/character/$1; }
#     location /                { return 301 https://www.moorednd.com/dndbattle; }
# }
