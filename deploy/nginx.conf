# nginx server block for the MooreDnD unified portal on CentOS.
# Install to /etc/nginx/conf.d/moorednd.conf, then: sudo nginx -t && sudo systemctl reload nginx
#
# Single origin (PLAN §4) so one JWT + one refresh cookie work everywhere:
#     /            -> unified SPA (static files, built by Vite)
#     /api/arena/  -> dndbattle arena server   (portal JWT accepted in Phase 2)
#     /api/        -> portal backend (fork of newweb/backend)
#
# nginx uses longest-prefix matching, so the /api/arena/ location wins over /api/
# regardless of order.

# Upstreams. Set the arena upstream to wherever the dndbattle server actually
# binds; 8090 is a placeholder wired in Phase 0 (the arena fork lands in Phase 2).
upstream moorednd_portal { server 127.0.0.1:8080; }
upstream moorednd_arena  { server 127.0.0.1:8090; }

server {
    listen 80;
    server_name moorednd.local;    # adjust to your hostname / add TLS in production

    root /opt/moorednd/frontend/dist;
    index index.html;

    # Long-cache hashed Vite assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── /api/arena -> arena server (fork of dndbattle) ────────────────────────
    # The arena keeps its native /api/* routes; the trailing "/api/" on proxy_pass
    # STRIPS the /arena segment, so /api/arena/characters -> arena /api/characters.
    # The arena accepts the portal JWT as `Authorization: Bearer` (PLAN §8).
    location /api/arena/ {
        proxy_pass http://moorednd_arena/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Arena uses a websocket for live arena state.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # ── /api -> portal backend. Pass cookies/headers through for JWT refresh. ──
    location /api/ {
        proxy_pass http://moorednd_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streamed Drive images can be large; relax buffering.
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    # SPA fallback: every non-file path returns index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
