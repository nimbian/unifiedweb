[project]
name = "dnd-arena"
version = "0.1.0"
description = "D&D Arena — Twitch chat battle game (authoritative Python game server)"
requires-python = ">=3.12"
# Runtime deps for the full server. The Phase 1 game-rules module + simulator
# depend only on the stdlib (tomllib, random), so these need not be installed
# to run `pytest` or `python -m server.sim`. They come into play at the
# round-loop / chat / websocket stage.
dependencies = [
    "twitchio>=3.0",   # IRC chat + EventSub (Phase 2)
    "asyncpg>=0.29",   # PostgreSQL driver (server is the only writer)
    "fastapi>=0.110",  # hosts the Godot-facing WebSocket only
    "uvicorn>=0.29",   # ASGI server for FastAPI
    "python-dotenv>=1.0",
    "better-profanity>=0.7",  # character-name filter (reject, don't sanitize)
    "httpx>=0.27",     # Twitch OAuth token exchange for the player website
    "pyjwt[crypto]>=2.8",  # verify MooreDnD portal RS256 JWTs (public key only; PLAN §8)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
