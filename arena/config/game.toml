moore_coeff = 1.0237

# --- Chat betting economy (PLAN.md §6.6) ---
# Free virtual "gold" only (never channel points / real currency). Viewers earn
# gold_per_round just for being present in chat, then !bet it on a fighter during
# ROSTER_LOCK. Payouts are pari-mutuel: winners split the round's pool in
# proportion to their stake; rake is the house take (0.0 = full pool to winners).
[economy]
starting_gold  = 100
gold_per_round = 10
min_bet        = 1
rake           = 0.0

# --- Twitch EventSub rewards (PLAN.md §6.2) ---
# Channel-point redemptions map (by reward title) to a game action; support
# events (subs/bits) grant gold = tier_value * gold_per_tier. Rename the titles
# to match the rewards you create in your Twitch dashboard.
[rewards]
gold_per_tier = 5

[rewards.titles]
"Extra Character Slot" = "extra_slot"
"Stat Reroll" = "stat_reroll"
"Priority Queue Token" = "priority_queue"

# --- Signature abilities (PLAN.md §4.2) ---
# Auto-cast once per round at a random mid-round moment; a "big animation" plays
# on the overlay. Four kinds cover all eight: damage_buff (timed), no_miss /
# crit_buff (counters), burst (instant flourish of `hits` x `hit_mult` avg hits).
# Balance-critical: re-tune class coeffs after any change (python -m server.sim).
[abilities.barbarian]
name = "Rage"
kind = "damage_buff"
magnitude = 0.40                         # +40% damage...
duration = 10.0                          # ...for 10s

[abilities.fighter]
name = "Second Wind"
kind = "no_miss"
count = 3                                # next 3 swings can't miss

[abilities.rogue]
name = "Backstab"
kind = "crit_buff"
count = 1                                # next hit...
magnitude = 0.50                         # ...+50% crit chance

[abilities.monk]
name = "Flurry"
kind = "burst"
hits = 5                                 # 5 rapid attacks...
hit_mult = 0.40                          # ...at 40% each

[abilities.paladin]
name = "Smite"
kind = "burst"
hits = 1                                 # one attack...
hit_mult = 3.0                           # ...at 3x

[abilities.ranger]
name = "Volley"
kind = "burst"
hits = 3                                 # 3 arrows...
hit_mult = 0.60                          # ...at 60% each

[abilities.warlock]
name = "Curse"
kind = "damage_buff"
magnitude = 0.20                         # +20% damage dealt...
duration = 15.0                          # ...for 15s

[abilities.wizard]
name = "Fireball"
kind = "burst"
hits = 1                                 # one massive hit...
hit_mult = 2.5                           # ...at 2.5x, with a screen flash

# Phase 2 class abilities (designed to fit archetype; balance via the tuner).
[abilities.cleric]
name = "Bless"
kind = "damage_buff"
magnitude = 0.25                         # +25% damage...
duration = 12.0                          # ...for 12s (steady support buff)

[abilities.bard]
name = "Inspiration"
kind = "crit_buff"
count = 2                                # next 2 hits...
magnitude = 0.35                         # ...+35% crit chance

[abilities.artificer]
name = "Turret Volley"
kind = "burst"
hits = 4                                 # 4 rapid turret shots...
hit_mult = 0.55                          # ...at 55% each

[abilities.druid]
name = "Wild Shape"
kind = "damage_buff"
magnitude = 0.45                         # +45% damage (beast form)...
duration = 8.0                           # ...for 8s (big but brief)

[abilities.sorcerer]
name = "Chaos Bolt"
kind = "burst"
hits = 2                                 # a bolt that leaps once...
hit_mult = 1.4                           # ...2 hits at 140% each

# --- Races and passives (PLAN.md §4.3) ---
# Chosen (not rolled) at creation; race is flavor + one small passive (<= ~5%
# expected DPS), tuned by the simulator. Every knob defaults to a no-op, so a
# race lists only what it changes. Event-conditional passives (Tiefling/Aasimar
# event bonus, Dwarf curse immunity) stay inert until arena events + Curse land.
[races.human]
all_stats_bonus = 1                      # +1 to every stat at creation
damage_mult = 0.985                      # normalizer: +1-all is worth +6.4% DPS raw
                                         # (integer bonus, can't trim); nets ~+4.9%

[races.elf]
crit_chance_bonus = 0.03                 # +3% chance to upgrade a hit to a crit

[races.dwarf]
con_bonus = 2                            # +2 CON at creation
curse_immune = true                      # immune to Curse-type debuffs (inert now)

[races.orc]
first_hit_mult = 1.9                     # first swing of the round deals 1.9x
                                         # (was spec 2.0 = +5.2% DPS; 1.9 -> ~+4.7%)

[races.halfling]
lucky_reroll_ones = 1                    # reroll the first natural 1 each round

[races.tiefling]
event_damage_bonus = 0.05                # +5% dmg during matching events (inert now)
event_tags = ["fire", "blood_moon"]

[races.dragonborn]
breath_every = 10                        # every 10th swing adds a breath bonus...
breath_bonus_mult = 0.5                  # ...worth ~0.5 of an average hit

[races.gnome]
xp_mult = 1.05                           # +5% XP earned (no DPS impact)

[races.goblin]
attack_speed_mult = 1.10                 # +10% attack speed...
damage_mult = 0.95                       # ...-5% damage per hit

[races.aasimar]
event_damage_bonus = 0.05                # +5% dmg during Blessing events
event_tags = ["blessing"]

# --- Random arena events (PLAN.md §4.6, Phase 3) ---
# One GLOBAL round modifier, rolled at round start with probability
# [round].event_chance and applied to every fighter. Owner standard (2026-07-05):
# every event is a flat damage bonus/penalty at one of two tiers —
# MINOR = +/-5%, MAJOR = +/-10%. A uniform multiplier is win-rate-neutral on its
# own; the balance effect comes through the matching race passive
# (Tiefling/Aasimar event_damage_bonus, Dwarf curse_immune) — which is what
# activates those otherwise-inert passives (§4.3). Engine-agnostic: the same flat
# damage_mult applies under both the classic and moore combat engines.
# (The crit_* / no_miss / xp_mult knobs still exist for future events but are
# unused by this set.) Re-run `python -m server.sim --rounds 100000 --events`
# after any change.
[events.fire]
label = "Fire Storm"                     # MAJOR boon; Tiefling +5% via event_tags
tag = "fire"
damage_mult = 1.10                       # +10% damage to all

[events.blessing]
label = "Blessing"                       # MINOR boon; Aasimar +5% via event_tags
tag = "blessing"
damage_mult = 1.05                       # +5% damage to all

[events.crowd]
label = "Roaring Crowd"                  # MINOR boon
damage_mult = 1.05                       # +5% damage to all (the crowd spurs everyone on)

[events.curse]
label = "Curse"                          # MAJOR bane; Dwarf is immune (curse_immune)
curse = true
damage_mult = 0.90                       # -10% damage to all (except Dwarves)

[events.fog]
label = "Fog"                            # MAJOR bane
damage_mult = 0.90                       # -10% damage to all

[events.blood_moon]
label = "Blood Moon"                     # MAJOR bane; Tiefling resists +5% via event_tags
tag = "blood_moon"
damage_mult = 0.90                       # -10% damage to all (fiends endure it better)

[events.rain]
label = "Rain"                           # MINOR bane
damage_mult = 0.95                       # -5% damage to all

