coeff = 1.1462
moore_coeff = 1.1435

# Phase 2 classes (PLAN.md §4.2): primary/secondary are per spec; attack intervals
# and signature abilities are designed to fit each archetype (coeffs tuned by the
# simulator, so the interval only shapes cadence/feel, not power).
[classes.cleric]
primary = "STR"
